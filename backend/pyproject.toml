[project]
name = "reqripple-backend"
version = "0.1.0"
description = "ReqRipple: Software Requirement Change Impact Analyser - Backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
